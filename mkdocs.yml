site_name: How to Use Claw Code
site_description: |-
  This guide includes:
  - How to install build tools,
  - How to build Claw Code from source,
  - How to start using Claw Code with the command line interface (CLI),
  - How to use Claw Code with providers like OpenRouter and local models.
repo_url: https://github.com/roflsunriz/how-to-use-claw-code
repo_name: roflsunriz/how-to-use-claw-code

site_url: https://roflsunriz.github.io/how-to-use-claw-code/

nav:
  - Home: index.md
  - Install:
      - Install(English): INSTALL-en-US-win.md
      - Install(日本語): INSTALL-ja-JP-win.md
  - Providers:
      - OpenRouter:
          - OpenRouter(English): OPENROUTER-en-US.md
          - OpenRouter(日本語): OPENROUTER-ja-JP.md
      - Local Models:
          - Local Models(English): LOCAL-MODELS-en-US.md
          - Local Models(日本語): LOCAL-MODELS-ja-JP.md
  - Others:
      - Coding Agents:
          - Coding Agents(English): CODING-AGENTS-en-US.md
          - Coding Agents(日本語): CODING-AGENTS-ja-JP.md

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
