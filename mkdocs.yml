site_name: How to Use Claw Code
site_description: |-
  This guide includes:
  - How to install build tools,
  - How to build Claw Code from source,
  - How to start using Claw Code with the command line interface (CLI),
  - How to use Claw Code with providers like OpenRouter and local models.
repo_url: https://github.com/roflsunriz/how-to-use-claw-code
repo_name: roflsunriz/how-to-use-claw-code

site_url: https://roflsunriz.github.io/how-to-use-claw-code/

nav:
  - Home: index.md
  - Windows:
      - English: USAGE-en-US-win.md
      - 日本語: USAGE-ja-JP-win.md
  - Providers:
      - OpenRouter:
          - English: OPENROUTER-en-US.md
          - 日本語: OPENROUTER-ja-JP.md
      - Local Models:
          - English: LOCAL-MODELS-en-US.md
          - 日本語: LOCAL-MODELS-ja-JP.md
      - Coding Agents:
          - English: CODING-AGENTS-en-US.md
          - 日本語: CODING-AGENTS-ja-JP.md

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
