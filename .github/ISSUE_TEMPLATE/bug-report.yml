name: 不具合報告 / Bug report
description: 再現できる不具合や資料の誤りを報告します。 / Report a reproducible problem or an error in the documentation.
title: '[Bug] '
labels:
- bug
body:
- type: markdown
  attributes:
    value: 'ありがとうございます。入力できる範囲で具体的に記載してください。脆弱性の報告は [SECURITY.md](https://github.com/roflsunriz/how-to-use-claw-code/blob/main/SECURITY.md)
      の窓口を使い、公開Issueへ詳細を書かないでください。

      Please provide concrete details. Use SECURITY.md for vulnerability reports and keep them out of
      public issues.'
- type: checkboxes
  id: preflight
  attributes:
    label: 事前確認 / Before reporting
    description: 確認できた項目にチェックしてください。未確認でも報告できます。 / Check what you verified; unchecked items do not prevent
      submission.
    options:
    - label: READMEと関連手順を確認しました。 / I checked the README and relevant guides.
    - label: 既存のIssueを検索しました。 / I searched existing issues.
  validations:
    required: false
- type: input
  id: version
  attributes:
    label: 対象の版・リビジョン / Version or revision
    description: リリース版、コミット、または閲覧した文書の版。不明な場合は「不明」と起動・入手方法を記載してください。 / Release, commit or document revision;
      if unknown, say so and explain how you obtained it.
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: 対象と環境 / Environment and affected component
    description: 文書の言語（日本語/英語）、対象ファイル・見出し・公開URL、文書のコミット、説明対象のツール版とOS。 / Document language, file/section/URL,
      revision, relevant tool version and OS.
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: 再現手順 / Steps to reproduce
    description: 初期状態、操作順、発生頻度、最小の入力例を記載してください。 / Include the initial state, steps, frequency and a minimal
      example.
    placeholder: '1. ...

      2. ...

      3. ...'
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: 期待した結果 / Expected result
    description: どの結果を期待しましたか。根拠となる文書があれば示してください。 / What should happen? Link to relevant documentation
      if available.
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: 実際の結果 / Actual result
    description: 表示、動作、エラーを具体的に記載してください。 / Describe the observed behavior or error.
  validations:
    required: true
- type: textarea
  id: diagnostics
  attributes:
    label: 診断情報 / Diagnostics
    description: 関連するログ・最小例・画像を、秘密情報と個人情報を除いて添付してください。私的なデータ一式や認証ファイルは不要です。 / Attach only relevant sanitized
      logs, examples or screenshots; omit private data and credential files.
  validations:
    required: false
- type: textarea
  id: additional
  attributes:
    label: 補足 / Additional context
    description: 回避策、以前動いた版、関連Issueなど。 / Workarounds, previously working versions or related issues.
  validations:
    required: false
- type: checkboxes
  id: privacy
  attributes:
    label: 公開情報の確認 / Publication check
    description: 非公開リポジトリの場合も、秘密値を含めずアクセス可能な人に共有できる内容だけを記載してください。 / Even in private repositories, omit
      secrets and include only information suitable for authorized participants.
    options:
    - label: APIキー、Cookie、認証情報、個人情報、非公開の脆弱性詳細を含めないことを確認しました。 / I removed credentials, personal data and
        non-public vulnerability details.
      required: true
  validations:
    required: true
