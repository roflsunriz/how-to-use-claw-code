name: 機能・改善提案 / Feature request
description: 機能、文書、使い方の改善を提案します。 / Suggest improvements to features, documentation or usage.
title: '[Feature] '
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: 'ありがとうございます。入力できる範囲で具体的に記載してください。脆弱性の報告は [SECURITY.md](https://github.com/roflsunriz/how-to-use-claw-code/blob/main/SECURITY.md)
      の窓口を使い、公開Issueへ詳細を書かないでください。

      Please provide concrete details. Use SECURITY.md for vulnerability reports and keep them out of
      public issues.'
- type: textarea
  id: problem
  attributes:
    label: 解決したい問題 / Problem to solve
    description: 誰がどの場面で困っていますか。既存の方法で足りない点を説明してください。 / Who encounters this problem and what does the
      existing approach lack?
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: 提案 / Proposed change
    description: 希望する動作・内容と、改善を確認できる例を記載してください。 / Describe the desired behavior or content and an example
      of success.
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: 代替案と互換性 / Alternatives and compatibility
    description: 検討した別の方法、既存の使い方・保存データ・対応環境への影響を記載してください。不明ならその旨を記載してください。 / List alternatives and impacts
      on existing usage, data or supported environments; state any uncertainty.
  validations:
    required: true
- type: textarea
  id: additional
  attributes:
    label: 補足 / Additional context
    description: 対象の版、参考資料、関連Issue、共有可能な画像など。 / Relevant versions, references, issues or shareable images.
  validations:
    required: false
- type: checkboxes
  id: privacy
  attributes:
    label: 公開情報の確認 / Publication check
    description: 非公開リポジトリの場合も、秘密値を含めずアクセス可能な人に共有できる内容だけを記載してください。 / Even in private repositories, omit
      secrets and include only information suitable for authorized participants.
    options:
    - label: APIキー、Cookie、認証情報、個人情報、非公開の脆弱性詳細を含めないことを確認しました。 / I removed credentials, personal data and
        non-public vulnerability details.
      required: true
  validations:
    required: true
